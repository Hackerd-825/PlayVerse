<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sudoku</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:#e5e7eb;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
  }
  h1{margin-bottom:10px}
  .controls{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
    justify-content:center;
  }
  select,button{
    background:#1f2937;
    color:#e5e7eb;
    border:1px solid #4b5563;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  button:hover,select:hover{border-color:#9ca3af}
  #status{margin-bottom:10px;min-height:20px}
  .grid{
    display:grid;
    gap:3px;
    background:#020617;
    padding:6px;
    border-radius:8px;
    border:1px solid #1f2937;
  }
  .cell{
    text-align:center;
    font-size:20px;
    border-radius:4px;
    border:1px solid #4b5563;
    background:#111827;
    color:#e5e7eb;
  }
  .cell:focus{
    outline:none;
    border-color:#9ca3af;
  }
  .fixed{
    background:#1f2937;
  }
</style>
</head>
<body>

<h1>Sudoku</h1>

<div class="controls">
  <select id="size">
    <option value="4">4×4</option>
    <option value="9">9×9</option>
    <option value="16">16×16</option>
  </select>
  <button id="newBtn">Nouvelle grille</button>
  <button id="checkBtn">Vérifier</button>
</div>

<div id="status">Choisis une taille et génère une grille.</div>

<div class="grid" id="grid"></div>

<script>
(() => {
  const gridDiv = document.getElementById('grid');
  const sizeSel = document.getElementById('size');
  const statusDiv = document.getElementById('status');
  const newBtn = document.getElementById('newBtn');
  const checkBtn = document.getElementById('checkBtn');

  let N = 4;
  let solution = [];
  let puzzle = [];

  function generateSolution(n){
    const base = [];
    const root = Math.sqrt(n);

    for(let r=0;r<n;r++){
      base[r] = [];
      for(let c=0;c<n;c++){
        base[r][c] = (r*root + Math.floor(r/root) + c) % n + 1;
      }
    }

    const rows = [...Array(n).keys()];
    const cols = [...Array(n).keys()];

    shuffle(rows);
    shuffle(cols);

    return rows.map(r => cols.map(c => base[r][c]));
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()* (i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  }

  function generatePuzzle(){
    puzzle = solution.map(row => row.map(v => Math.random() < 0.55 ? v : 0));
  }

  function render(){
    gridDiv.innerHTML = '';
    const cellSize = Math.max(28, Math.floor(300 / N));
    gridDiv.style.gridTemplateColumns = `repeat(${N}, ${cellSize}px)`;
    gridDiv.style.gridTemplateRows = `repeat(${N}, ${cellSize}px)`;

    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        const inp = document.createElement('input');
        inp.className = 'cell';
        inp.maxLength = 2;
        inp.style.width = cellSize + 'px';
        inp.style.height = cellSize + 'px';

        if(puzzle[r][c] !== 0){
          inp.value = puzzle[r][c];
          inp.readOnly = true;
          inp.classList.add('fixed');
        }

        inp.dataset.r = r;
        inp.dataset.c = c;

        inp.addEventListener('input', () => {
          inp.value = inp.value.replace(/[^0-9]/g,'');
        });

        gridDiv.appendChild(inp);
      }
    }
  }

  function check(){
    const cells = gridDiv.querySelectorAll('.cell');
    let ok = true;

    cells.forEach(inp => {
      const r = inp.dataset.r;
      const c = inp.dataset.c;
      if(inp.value != solution[r][c]) ok = false;
    });

    statusDiv.textContent = ok ? 'Bravo ! Grille correcte.' : 'Il y a des erreurs.';
  }

  newBtn.addEventListener('click', () => {
    N = parseInt(sizeSel.value);
    solution = generateSolution(N);
    generatePuzzle();
    render();
    statusDiv.textContent = 'Nouvelle grille générée.';
  });

  checkBtn.addEventListener('click', check);
})();
</script>

</body>
</html>
