<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Devine le nombre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .panel {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }

        .row {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            min-width: 70px;
        }

        input[type="number"] {
            background: #111827;
            border: 1px solid #4b5563;
            border-radius: 4px;
            padding: 6px;
            color: #e5e7eb;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: #e5e7eb;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 10px;
            min-height: 20px;
        }

        #history {
            margin-top: 10px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <h1>Devine le nombre</h1>

    <div class="panel">
        <div class="row">
            <label for="min">Min :</label>
            <input type="number" id="min" value="1">
        </div>
        <div class="row">
            <label for="max">Max :</label>
            <input type="number" id="max" value="100">
        </div>
        <div class="row">
            <button id="start">Commencer une partie</button>
        </div>

        <hr style="border-color:#374151; margin:15px 0;">

        <div class="row">
            <label for="guess">Essai :</label>
            <input type="number" id="guess" disabled>
        </div>
        <div class="row" style="justify-content: flex-end;">
            <button id="try" disabled>Tester</button>
        </div>

        <div id="status"></div>
        <div id="history"></div>
    </div>

    <script>
        const minInput = document.getElementById('min');
        const maxInput = document.getElementById('max');
        const startButton = document.getElementById('start');
        const guessInput = document.getElementById('guess');
        const tryButton = document.getElementById('try');
        const statusDiv = document.getElementById('status');
        const historyDiv = document.getElementById('history');

        let secretNumber = null;
        let min = null;
        let max = null;
        let attempts = 0;
        let gameActive = false;

        function startGame() {
            min = parseInt(minInput.value, 10);
            max = parseInt(maxInput.value, 10);

            if (isNaN(min) || isNaN(max)) {
                statusDiv.textContent = "Entre un min et un max valides.";
                return;
            }
            if (min >= max) {
                statusDiv.textContent = "Le min doit être strictement inférieur au max.";
                return;
            }

            secretNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            attempts = 0;
            gameActive = true;

            guessInput.disabled = false;
            tryButton.disabled = false;
            guessInput.value = "";
            guessInput.focus();

            statusDiv.textContent = `J'ai choisi un nombre entre ${min} et ${max}. À toi de jouer !`;
            historyDiv.textContent = "";
        }

        function tryGuess() {
            if (!gameActive) return;

            const guess = parseInt(guessInput.value, 10);

            if (isNaN(guess)) {
                statusDiv.textContent = "Entre un nombre.";
                return;
            }
            if (guess < min || guess > max) {
                statusDiv.textContent = `Ton nombre doit être entre ${min} et ${max}.`;
                return;
            }

            attempts++;

            if (guess < secretNumber) {
                statusDiv.textContent = "C'est plus grand.";
                appendHistory(guess, "trop petit");
            } else if (guess > secretNumber) {
                statusDiv.textContent = "C'est plus petit.";
                appendHistory(guess, "trop grand");
            } else {
                statusDiv.textContent = `Bravo ! Tu as trouvé ${secretNumber} en ${attempts} essai(s).`;
                appendHistory(guess, "juste");
                gameActive = false;
                guessInput.disabled = true;
                tryButton.disabled = true;
            }

            guessInput.value = "";
            guessInput.focus();
        }

        function appendHistory(guess, note) {
            const previous = historyDiv.textContent ? historyDiv.textContent + "\n" : "";
            historyDiv.textContent = previous + `Essai ${attempts} : ${guess} (${note})`;
        }

        // Listeners
        startButton.addEventListener('click', startGame);
        tryButton.addEventListener('click', tryGuess);
        guessInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                tryGuess();
            }
        });
    </script>
</body>
</html>
