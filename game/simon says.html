<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simon Says</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 40px;
        }
        h1 { margin-bottom: 10px; }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { border-color: #9ca3af; }
        #status { margin-bottom: 10px; min-height: 20px; }
        .board {
            display: grid;
            grid-template-columns: repeat(2, 120px);
            grid-template-rows: repeat(2, 120px);
            gap: 10px;
        }
        .pad {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            opacity: 0.7;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
        }
        .pad.active {
            opacity: 1;
            transform: scale(1.05);
        }
        .pad0 { background: #ef4444; }
        .pad1 { background: #22c55e; }
        .pad2 { background: #3b82f6; }
        .pad3 { background: #eab308; }
    </style>
</head>
<body>
<h1>Simon Says</h1>

<div class="controls">
    <button id="start">Démarrer</button>
</div>

<div id="status">Clique sur Démarrer pour commencer.</div>

<div class="board">
    <div class="pad pad0" data-id="0"></div>
    <div class="pad pad1" data-id="1"></div>
    <div class="pad pad2" data-id="2"></div>
    <div class="pad pad3" data-id="3"></div>
</div>

<script>
    const pads = Array.from(document.querySelectorAll(".pad"));
    const statusDiv = document.getElementById("status");
    let sequence = [];
    let playerIndex = 0;
    let playing = false;

    function sleep(ms) {
        return new Promise(res => setTimeout(res, ms));
    }

    async function playSequence() {
        playing = true;
        for (const id of sequence) {
            const pad = pads[id];
            pad.classList.add("active");
            await sleep(400);
            pad.classList.remove("active");
            await sleep(150);
        }
        playing = false;
        statusDiv.textContent = "À toi !";
    }

    async function nextRound() {
        playerIndex = 0;
        sequence.push(Math.floor(Math.random() * 4));
        statusDiv.textContent = `Niveau ${sequence.length}`;
        await sleep(500);
        playSequence();
    }

    function resetGame() {
        sequence = [];
        playerIndex = 0;
        playing = false;
        statusDiv.textContent = "Clique sur Démarrer pour commencer.";
    }

    pads.forEach(pad => {
        pad.addEventListener("click", () => {
            if (playing || sequence.length === 0) return;
            const id = Number(pad.dataset.id);
            pad.classList.add("active");
            setTimeout(() => pad.classList.remove("active"), 150);

            if (id === sequence[playerIndex]) {
                playerIndex++;
                if (playerIndex === sequence.length) {
                    statusDiv.textContent = "Bien joué ! Prochain niveau...";
                    setTimeout(nextRound, 700);
                }
            } else {
                statusDiv.textContent = `Raté ! Tu as atteint le niveau ${sequence.length}.`;
                resetGame();
            }
        });
    });

    document.getElementById("start").addEventListener("click", () => {
        resetGame();
        nextRound();
    });
</script>
</body>
</html>
