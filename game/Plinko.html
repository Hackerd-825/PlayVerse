<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plinko</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #020617;
            color: #e2e8f0;
            text-align: center;
            padding-top: 20px;
        }

        #board {
            margin: 20px auto;
            width: 900px;
            height: 1100px;
            position: relative;
            background: #020617;
            border-radius: 10px;
            border: 2px solid #334155;
            overflow: hidden;
        }

        .peg {
            width: 10px;
            height: 10px;
            background: #64748b;
            border-radius: 50%;
            position: absolute;
        }

        .slot {
            height: 60px;
            background: #111827;
            position: absolute;
            bottom: 0;
            color: #fecaca;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            border-top: 1px solid #1e293b;
            border-left: 1px solid #1e293b;
            box-sizing: border-box;
        }

        .ball {
            width: 14px;
            height: 14px;
            background: #facc15;
            border-radius: 50%;
            position: absolute;
        }

        button {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #dc2626;
        }

        #money, #lastWin {
            margin-top: 10px;
            font-size: 22px;
        }

        #log {
            margin-top: 15px;
            font-size: 14px;
            color: #9ca3af;
            max-height: 220px;
            overflow-y: auto;
            width: 900px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
            background: #020617;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>Plinko XXL — 30 cases</h1>

    <div id="money">Solde : 1000 €</div>
    <div id="lastWin">Dernier résultat : 0 €</div>

    <button onclick="buyBalls(1)">Acheter 1 balle (10 €)</button>
    <button onclick="buyBalls(5)">Acheter 5 balles (50 €)</button>
    <button onclick="buyBalls(10)">Acheter 10 balles (100 €)</button>
    <button onclick="buyBalls(50)">Acheter 50 balles (500 €)</button>

    <div id="board"></div>

    <div id="log"></div>

    <script>
        let money = 1000;
        const board = document.getElementById("board");
        const lastWinDisplay = document.getElementById("lastWin");
        const log = document.getElementById("log");

        // 30 récompenses : 10 négatives/neutres, 20 positives
        const slots = [
            -20, -10, -5, -1, 0, 0, -1, -5, -10, -20,
            1, 2, 5, 10, 20, 50, 100, 200, 100, 50,
            20, 10, 5, 2, 1, 2, 5, 10, 20, 50
        ];

        const pegs = [];

        // Triangle de piques
        function createPegs() {
            const rows = 20;          // nombre de lignes de piques
            const spacingX = 40;
            const spacingY = 50;

            for (let r = 0; r < rows; r++) {
                const count = r + 1;
                const offset = (900 - count * spacingX) / 2;

                for (let c = 0; c < count; c++) {
                    const peg = document.createElement("div");
                    peg.classList.add("peg");

                    const x = offset + c * spacingX;
                    const y = 80 + r * spacingY;

                    peg.style.left = x + "px";
                    peg.style.top = y + "px";

                    board.appendChild(peg);
                    pegs.push({ x, y });
                }
            }
        }

        // Slots du bas
        function createSlots() {
            const totalWidth = 900;
            const slotWidth = totalWidth / slots.length;

            for (let i = 0; i < slots.length; i++) {
                const slot = document.createElement("div");
                slot.classList.add("slot");
                slot.style.width = slotWidth + "px";
                slot.style.left = (i * slotWidth) + "px";

                slot.textContent = slots[i] + "€";
                board.appendChild(slot);
            }
        }

        createPegs();
        createSlots();

        function updateMoney() {
            document.getElementById("money").textContent = "Solde : " + money + " €";
        }

        function logMessage(msg) {
            const time = new Date().toLocaleTimeString();
            log.innerHTML = `[${time}] ${msg}<br>` + log.innerHTML;
        }

        function buyBalls(count) {
            const cost = count * 10;
            if (money < cost) return;

            money -= cost;
            updateMoney();
            logMessage(`Achat de ${count} balle(s) pour -${cost} €`);

            for (let i = 0; i < count; i++) {
                setTimeout(() => dropBall(), i * 60);
            }
        }

        function dropBall() {
            const ball = document.createElement("div");
            ball.classList.add("ball");

            let x = 450 + (Math.random() * 40 - 20); // départ au centre
            let y = 0;

            let vx = Math.random() * 4 - 2; // vitesse horizontale initiale
            let vy = 2;                     // vitesse verticale initiale

            ball.style.left = x + "px";
            ball.style.top = y + "px";

            board.appendChild(ball);

            const interval = setInterval(() => {
                // gravité
                vy += 0.25;

                // déplacement
                x += vx;
                y += vy;

                // collisions avec les piques
                for (const peg of pegs) {
                    const dx = x - peg.x;
                    const dy = y - peg.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 15) {
                        vx = (Math.random() * 6 - 3);              // déviation latérale
                        vy = 2 + Math.random() * 1.5;              // petit reset vertical
                    }
                }

                // rebonds sur les bords
                if (x < 5 || x > 885) {
                    vx = -vx;
                    x = Math.max(5, Math.min(885, x));
                }

                ball.style.left = x + "px";
                ball.style.top = y + "px";

                // arrivé en bas
                if (y >= 1030) {
                    clearInterval(interval);

                    const totalWidth = 900;
                    const slotWidth = totalWidth / slots.length;
                    let index = Math.floor(x / slotWidth);
                    if (index < 0) index = 0;
                    if (index >= slots.length) index = slots.length - 1;

                    const gain = slots[index] || 0;

                    money += gain;
                    updateMoney();

                    lastWinDisplay.textContent = "Dernier résultat : " + gain + " €";
                    logMessage(`Balle terminée → ${gain} €`);

                    setTimeout(() => ball.remove(), 700);
                }
            }, 20);
        }
    </script>

</body>
</html>
