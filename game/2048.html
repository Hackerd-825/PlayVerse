<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>2048</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:Arial, sans-serif;background:#111827;color:#e5e7eb;display:flex;flex-direction:column;align-items:center;padding:28px;margin:0}
  h1{margin:0 0 12px}
  .controls{display:flex;gap:10px;margin-bottom:12px}
  button,select{background:#1f2937;color:#e5e7eb;border:1px solid #4b5563;padding:8px 10px;border-radius:6px;cursor:pointer}
  button:hover,select:hover{border-color:#9ca3af}
  #status{min-height:20px;margin-bottom:12px}
  .board{background:#1f2937;padding:12px;border-radius:10px;display:grid;grid-template-columns:repeat(4,80px);grid-template-rows:repeat(4,80px);gap:10px}
  .cell{width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;border:1px solid #374151;background:#111827;color:#e5e7eb}
  .v2{background:#e5e7eb;color:#111827}
  .v4{background:#bfdbfe;color:#111827}
  .v8{background:#60a5fa}
  .v16{background:#3b82f6}
  .v32{background:#2563eb}
  .v64{background:#1d4ed8}
  .v128{background:#fbbf24;color:#111827}
  .v256{background:#f59e0b}
  .v512{background:#f97316}
  .v1024{background:#ef4444}
  .v2048{background:#22c55e}
  .mobile-controls{display:none;margin-top:14px;text-align:center}
  .mobile-controls .row{display:flex;justify-content:center;gap:8px}
  .mobile-controls button{padding:12px 16px;font-size:18px;border-radius:8px}
</style>
</head>
<body>
  <h1>2048</h1>

  <div class="controls">
    <button id="newGame">Nouvelle partie</button>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:14px;color:#9ca3af">Contrôles</label>
    </div>
  </div>

  <div id="status">Utilise les flèches du clavier ou les contrôles tactiles.</div>

  <div class="board" id="board" aria-hidden="false"></div>

  <div class="mobile-controls" id="mobileControls" aria-hidden="true">
    <div><button data-dir="up">▲</button></div>
    <div class="row">
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
    </div>
    <div><button data-dir="down">▼</button></div>
  </div>

<script>
(() => {
  const SIZE = 4;
  const boardDiv = document.getElementById('board');
  const status = document.getElementById('status');
  const newGameBtn = document.getElementById('newGame');
  const mobileControls = document.getElementById('mobileControls');

  let grid = [];

  function createBoard(){
    boardDiv.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardDiv.appendChild(cell);
      }
    }
  }

  function addRandom(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empties.push({r,c});
    if(!empties.length) return;
    const {r,c} = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random()<0.9?2:4;
  }

  function draw(){
    const cells = boardDiv.children;
    let i=0;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = grid[r][c];
        const el = cells[i++];
        el.className = 'cell';
        if(v!==0){
          el.textContent = v;
          el.classList.add('v'+v);
        } else {
          el.textContent = '';
        }
      }
    }
  }

  function init(){
    grid = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    addRandom(); addRandom();
    draw();
    status.textContent = 'Bonne partie.';
  }

  function transpose(m){
    return m[0].map((_,i)=>m.map(row=>row[i]));
  }

  function reverseRows(m){
    return m.map(row=>[...row].reverse());
  }

  function slideAndMergeRow(row){
    const arr = row.filter(v=>v!==0);
    for(let i=0;i<arr.length-1;i++){
      if(arr[i]===arr[i+1]){
        arr[i]*=2;
        arr[i+1]=0;
      }
    }
    const res = arr.filter(v=>v!==0);
    while(res.length<4) res.push(0);
    return res;
  }

  function movedEquals(a,b){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(a[r][c]!==b[r][c]) return true;
    return false;
  }

  function moveLeft(){
    const before = grid.map(r=>[...r]);
    for(let r=0;r<SIZE;r++) grid[r] = slideAndMergeRow(grid[r]);
    if(movedEquals(before,grid)){ addRandom(); draw(); checkEnd(); }
  }

  function moveRight(){
    const before = grid.map(r=>[...r]);
    for(let r=0;r<SIZE;r++){
      const rev = [...grid[r]].reverse();
      const merged = slideAndMergeRow(rev);
      grid[r] = merged.reverse();
    }
    if(movedEquals(before,grid)){ addRandom(); draw(); checkEnd(); }
  }

  function moveUp(){
    const before = grid.map(r=>[...r]);
    grid = transpose(grid);
    for(let r=0;r<SIZE;r++) grid[r] = slideAndMergeRow(grid[r]);
    grid = transpose(grid);
    if(movedEquals(before,grid)){ addRandom(); draw(); checkEnd(); }
  }

  function moveDown(){
    const before = grid.map(r=>[...r]);
    grid = transpose(grid);
    for(let r=0;r<SIZE;r++){
      const rev = [...grid[r]].reverse();
      const merged = slideAndMergeRow(rev);
      grid[r] = merged.reverse();
    }
    grid = transpose(grid);
    if(movedEquals(before,grid)){ addRandom(); draw(); checkEnd(); }
  }

  function hasMoves(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(grid[r][c]===0) return true;
      if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return true;
      if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return true;
    }
    return false;
  }

  function checkEnd(){
    if(!hasMoves()){
      status.textContent = 'Plus de coups possibles. Partie terminée.';
    }
  }

  // keyboard
  window.addEventListener('keydown', e=>{
    let moved=false;
    if(e.key==='ArrowLeft'){ moveLeft(); moved=true; }
    else if(e.key==='ArrowRight'){ moveRight(); moved=true; }
    else if(e.key==='ArrowUp'){ moveUp(); moved=true; }
    else if(e.key==='ArrowDown'){ moveDown(); moved=true; }
    if(moved) e.preventDefault();
  });

  // mobile detection and controls
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile){
    mobileControls.style.display = 'block';
    mobileControls.setAttribute('aria-hidden','false');
    mobileControls.querySelectorAll('button[data-dir]').forEach(btn=>{
      btn.addEventListener('touchstart', ev=>{
        const d = btn.dataset.dir;
        if(d==='up') moveUp();
        if(d==='down') moveDown();
        if(d==='left') moveLeft();
        if(d==='right') moveRight();
        ev.preventDefault();
      }, {passive:false});
    });

    // swipe
    let start = null;
    boardDiv.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; start={x:t.clientX,y:t.clientY}; }, {passive:true});
    boardDiv.addEventListener('touchend', e=>{
      if(!start) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - start.x;
      const dy = t.clientY - start.y;
      if(Math.abs(dx) > Math.abs(dy)){
        if(dx>30) moveRight(); else if(dx<-30) moveLeft();
      } else {
        if(dy>30) moveDown(); else if(dy<-30) moveUp();
      }
      start = null;
    }, {passive:true});
  }

  newGameBtn.addEventListener('click', init);

  createBoard();
  init();
})();
</script>
</body>
</html>
