<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PlayVerse</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff;
      background-color: #0d0d0d;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    h1 {
      margin-top: 30px;
      font-size: 3em;
      text-shadow: 0 0 15px #00d4ff, 0 0 30px #00d4ff;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h2 {
      margin-top: 10px;
      font-size: 2em;
      text-shadow: 1px 1px 10px rgba(0,212,255,0.7);
    }

    .game-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-top: 50px;
    }

    .game-buttons a {
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease;
    }

    .game-buttons img {
      width: 200px;
      max-width: 80vw;
      height: auto;
      border-radius: 15px;
      border: 3px solid #444;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .game-buttons img:hover {
      transform: scale(1.1);
      border-color: #00d4ff;
      box-shadow: 0 0 35px rgba(0,212,255,0.8);
    }

    .game-title {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
    }

    footer {
      margin-top: 60px;
      font-size: 18px;
    }
    footer a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <!-- Message de bienvenue -->
  <h1>Bienvenue dans PlayVerse</h1>
  <!-- Sous-titre -->
  <h2>🎮 Sélectionne ton jeu</h2>

  <div class="game-buttons">
    <!-- Bouton Build a Jetpack -->
    <a href="Build_a_Jetpack.html">
      <img src="images/jetpack.png" alt="Build a Jetpack">
      <div class="game-title">Build a Jetpack</div>
    </a>

    <!-- Bouton Scrap Boy -->
    <a href="Scrap_Boy.html">
      <img src="images/scrapboy.png" alt="Scrap Boy">
      <div class="game-title">Scrap Boy</div>
    </a>
  </div>

  <footer>
    Créez votre jeu sur <a href="https://www.pico-8-edu.com/" target="_blank">PICO-8 en ligne</a>
  </footer>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    const particles = [];
    const N = 100;
    for (let i = 0; i < N; i++) {
      particles.push({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        r: Math.random()*2+1,
        dx: (Math.random()-0.5)*0.6, dy: (Math.random()-0.5)*0.6,
        c: '#00d4ff'
      });
    }
    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => {
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if (p.x<0||p.x>canvas.width) p.dx*=-1;
        if (p.y<0||p.y>canvas.height) p.dy*=-1;
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
